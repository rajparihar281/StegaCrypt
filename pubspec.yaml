name: data_hiding_app
description: "A Steganography app by Raj"
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.7.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  permission_handler: ^11.0.1
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  fluttertoast: ^8.2.4
  flutter_spinkit: ^5.2.0
  image: ^4.1.3
  intl: ^0.20.2
  logging: ^1.3.0
  share_plus: ^7.0.0
  flutter_launcher_icons: ^0.14.3
  google_fonts: ^8.2.1
  lucide_icons_flutter: ^3.1.17
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/screenshots/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300



flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"